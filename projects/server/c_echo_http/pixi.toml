[workspace]
name = "c-echo-http"
description = "An HTTP server on plain POSIX sockets that shows you your own request (C17)"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[dependencies]
cmake = ">=3.20"
ninja = "*"
# gcc from conda-forge, so every student builds with the same compiler.
c-compiler = ">=2.0.0,<3"
# Only for tests/test_contract.py, which checks the server from the outside,
# the same file as in py_echo_http.
python = "3.12.*"
pytest = ">=8,<10"

[tasks]
# Configure once; after that `cmake --build` reconfigures by itself when CMakeLists.txt changes.
configure = { cmd = "cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH=$CONDA_PREFIX", outputs = ["build/CMakeCache.txt"] }
build = { cmd = "cmake --build build", depends-on = ["configure"] }
# Unit tests of the parser (ctest), then the contract tests against the running server (pytest).
test = { cmd = "ctest --test-dir build --output-on-failure && pytest -q tests", depends-on = ["build"] }
start = { cmd = "./build/c_echo_http", depends-on = ["build"] }
# Start, fetch two pages with Python's urllib, stop: a quick end-to-end check.
smoke = { cmd = "python tests/smoke.py ./build/c_echo_http", depends-on = ["build"] }

# Asserts on, optimiser off, AddressSanitizer + UBSan, in its own tree.
build-debug = "cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSANITIZE=ON -DCMAKE_PREFIX_PATH=$CONDA_PREFIX && cmake --build build-debug"
# The contract tests run against the sanitizer build too: memory errors make it fail.
test-debug = { cmd = "ctest --test-dir build-debug --output-on-failure && pytest -q tests", env = { ECHO_HTTP_BIN = "build-debug/c_echo_http" }, depends-on = ["build-debug"] }
